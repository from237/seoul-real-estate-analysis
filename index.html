<script>
    // 1. 하드코딩된 원본 데이터 (CSV 로드 대체)
    const RAW_DATA = [
        { region: '강남구', price: 8150, academy: 2578, pop: 521806, infant_r: 2.8, elem_r: 3.5, adol_r: 4.2 },
        { region: '서초구', price: 7720, academy: 1187, pop: 406586, infant_r: 2.9, elem_r: 3.6, adol_r: 4.4 },
        { region: '용산구', price: 6250, academy: 180,  pop: 229431, infant_r: 2.3, elem_r: 2.8, adol_r: 3.1 },
        { region: '송파구', price: 5980, academy: 1155, pop: 667483, infant_r: 2.7, elem_r: 3.4, adol_r: 4.0 },
        { region: '성동구', price: 5250, academy: 320,  pop: 296854, infant_r: 2.6, elem_r: 3.3, adol_r: 3.5 },
        { region: '마포구', price: 4700, academy: 520,  pop: 374380, infant_r: 2.4, elem_r: 3.0, adol_r: 3.3 },
        { region: '광진구', price: 4450, academy: 390,  pop: 341889, infant_r: 2.5, elem_r: 3.1, adol_r: 3.4 },
        { region: '양천구', price: 4400, academy: 1050, pop: 454243, infant_r: 2.9, elem_r: 3.7, adol_r: 4.3 },
        { region: '영등포구', price: 4150, academy: 430,  pop: 389250, infant_r: 2.3, elem_r: 2.9, adol_r: 3.1 },
        { region: '강동구', price: 4100, academy: 680,  pop: 467593, infant_r: 2.8, elem_r: 3.5, adol_r: 3.8 },
        { region: '동작구', price: 4000, academy: 450,  pop: 389759, infant_r: 2.4, elem_r: 3.1, adol_r: 3.6 },
        { region: '중구',  price: 3850, academy: 150,  pop: 126603, infant_r: 2.1, elem_r: 2.6, adol_r: 2.8 },
        { region: '종로구', price: 3700, academy: 230,  pop: 148254, infant_r: 2.0, elem_r: 2.5, adol_r: 2.7 },
        { region: '서대문구', price: 3500, academy: 370,  pop: 312726, infant_r: 2.3, elem_r: 2.9, adol_r: 3.2 },
        { region: '동대문구', price: 3350, academy: 350,  pop: 345340, infant_r: 2.4, elem_r: 3.0, adol_r: 3.1 },
        { region: '성북구', price: 3150, academy: 550,  pop: 432267, infant_r: 2.5, elem_r: 3.1, adol_r: 3.3 },
        { region: '강서구', price: 3100, academy: 600,  pop: 569025, infant_r: 2.6, elem_r: 3.3, adol_r: 3.5 },
        { region: '관악구', price: 3000, academy: 380,  pop: 496243, infant_r: 2.1, elem_r: 2.6, adol_r: 2.8 },
        { region: '은평구', price: 2950, academy: 538,  pop: 477849, infant_r: 2.4, elem_r: 3.0, adol_r: 3.2 },
        { region: '구로구', price: 2850, academy: 340,  pop: 413516, infant_r: 2.5, elem_r: 3.1, adol_r: 3.2 },
        { region: '노원구', price: 2800, academy: 739,  pop: 516762, infant_r: 2.6, elem_r: 3.3, adol_r: 3.6 },
        { region: '중랑구', price: 2650, academy: 300,  pop: 391704, infant_r: 2.4, elem_r: 3.0, adol_r: 3.1 },
        { region: '강북구', price: 2600, academy: 220,  pop: 298957, infant_r: 2.2, elem_r: 2.7, adol_r: 2.9 },
        { region: '금천구', price: 2550, academy: 200,  pop: 234710, infant_r: 2.3, elem_r: 2.8, adol_r: 3.0 },
        { region: '도봉구', price: 2450, academy: 290,  pop: 319143, infant_r: 2.4, elem_r: 3.0, adol_r: 3.2 }
    ];

    // 2. 데이터 가공 로직 (파이썬에서 하던 작업을 JS에서 즉시 처리)
    const normalize = (arr) => {
        const min = Math.min(...arr), max = Math.max(...arr);
        return arr.map(v => (v - min) / (max - min || 1));
    };

    const data = RAW_DATA.map(d => {
        const adol_pop = Math.round(d.pop * (d.adol_r / 100));
        const density = adol_pop > 0 ? (d.academy / adol_pop) * 1000 : 0;
        return { ...d, adol_pop, density };
    });

    const norm_adol = normalize(data.map(d => d.adol_r));
    const norm_density = normalize(data.map(d => d.density));
    const norm_pop = normalize(data.map(d => d.pop));

    data.forEach((d, i) => {
        d.composite_index = (norm_adol[i] * 0.4) + (norm_density[i] * 0.4) + (norm_pop[i] * 0.2);
    });

    // 3. 통계 유틸리티 함수
    const pearson = (xs, ys) => {
        const n = xs.length, mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
        let num = 0, dx = 0, dy = 0;
        for(let i=0; i<n; i++) {
            const x = xs[i]-mx, y = ys[i]-my;
            num += x*y; dx += x*x; dy += y*y;
        }
        return num / Math.sqrt(dx*dy);
    };

    const linReg = (xs, ys) => {
        const n = xs.length, mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
        let num = 0, den = 0;
        for(let i=0; i<n; i++) {
            num += (xs[i]-mx)*(ys[i]-my);
            den += (xs[i]-mx)**2;
        }
        const slope = num/den;
        return { slope, intercept: my - slope*mx, predict: x => slope*x + (my - slope*mx) };
    };

    // 4. 차트 렌더링 시작
    Chart.defaults.color = '#a0a0a0';
    Chart.defaults.font.family = "'Noto Sans KR', sans-serif";

    const prices = data.map(d => d.price);
    const corrInfant = pearson(data.map(d => d.infant_r), prices);
    const corrElem = pearson(data.map(d => d.elem_r), prices);
    const corrAdol = pearson(data.map(d => d.adol_r), prices);

    // UI 업데이트
    document.getElementById('val-infant').innerText = corrInfant.toFixed(3);
    document.getElementById('val-adol').innerText = corrAdol.toFixed(3);
    document.getElementById('loader').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    // 차트 1: 상관계수 바 차트
    new Chart(document.getElementById('corrChart'), {
        type: 'bar',
        data: {
            labels: ['영유아(0-6)', '초등(7-12)', '입시생(13-18)'],
            datasets: [{
                data: [corrInfant, corrElem, corrAdol],
                backgroundColor: ['#4b4b4b', '#4b4b4b', '#3742fa'],
                borderRadius: 6
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, grid: { color: '#333' } }, x: { grid: { display: false } } }
        }
    });

    // 차트 2: 학원 밀도 바 차트 (Top 10)
    const densitySorted = [...data].sort((a, b) => b.density - a.density).slice(0, 10);
    new Chart(document.getElementById('densityChart'), {
        type: 'bar',
        data: {
            labels: densitySorted.map(d => d.region),
            datasets: [{
                data: densitySorted.map(d => d.density),
                backgroundColor: '#2ed573',
                borderRadius: 4
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { x: { grid: { color: '#333' } }, y: { grid: { display: false } } }
        }
    });

    // 차트 3: 스캐터 플롯 (종합 지수 vs 가격)
    const xs = data.map(d => d.composite_index);
    const ys = prices;
    const reg = linReg(xs, ys);
    const minX = Math.min(...xs), maxX = Math.max(...xs);

    new Chart(document.getElementById('scatterChart'), {
        type: 'scatter',
        data: {
            datasets: [
                {
                    label: '자치구',
                    data: data.map(d => ({ x: d.composite_index, y: d.price, label: d.region })),
                    backgroundColor: '#ff4757',
                    pointRadius: 6
                },
                {
                    label: '추세선',
                    data: [{ x: minX, y: reg.predict(minX) }, { x: maxX, y: reg.predict(maxX) }],
                    type: 'line',
                    borderColor: 'rgba(255, 255, 255, 0.3)',
                    borderDash: [5, 5],
                    pointRadius: 0
                }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: ctx => `${ctx.raw.label}: ${ctx.raw.y.toLocaleString()}만원` } }
            },
            scales: {
                x: { title: { display: true, text: '교육 프리미엄 지수', color: '#a0a0a0' }, grid: { color: '#333' } },
                y: { title: { display: true, text: '평당 가격 (만원)', color: '#a0a0a0' }, grid: { color: '#333' } }
            }
        }
    });
</script>
